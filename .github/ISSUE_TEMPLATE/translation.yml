name: Translation wording
description: A text sounds wrong or clumsy in your language.
labels: [documentation]
body:
  - type: input
    id: language
    attributes:
      label: Language
      placeholder: "German"
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Where the text appears
      placeholder: "Settings, General page, under Start with Windows"
    validations:
      required: true
  - type: textarea
    id: current
    attributes:
      label: Current text
    validations:
      required: true
  - type: textarea
    id: better
    attributes:
      label: Better wording
      description: And, if useful, why (the usual Windows term, grammar, tone).
    validations:
      required: true
