name: Idea or request
description: Suggest a new feature or a change.
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: The idea
      description: What BetterVolume should do.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why
      description: The situation where you need it, and how you do it today.
    validations:
      required: true
