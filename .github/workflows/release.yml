# Release automation. Pushing a version tag (v2.0.0,
# v2.1.0-beta.1) builds the two release files with every gate of tools\check.ps1 (release
# build with build-machine paths remapped), then creates a DRAFT release holding
# them. Nothing reaches users until a maintainer reviews the draft and clicks "Publish".
# The Microsoft Store package made by the same gates is kept with the run, for the Store.
#
# The release build names the repository it was made from (BETTERVOLUME_REPOSITORY), so
# the published program checks for updates there (FR-132); builds made elsewhere do not.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and draft the release
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      BETTERVOLUME_REPOSITORY: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4

      - name: Install the pinned Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      # The tag must be the version written in Cargo.toml: the program, its
      # installed-apps entry and the file names all carry that number.
      - name: Check the tag against the version
        id: version
        shell: powershell
        run: |
          $manifest = Get-Content Cargo.toml -Raw
          $match = [regex]::Match($manifest, '(?ms)^\[workspace\.package\].*?^version\s*=\s*"([^"]+)"')
          if (-not $match.Success) { Write-Host 'workspace version not found'; exit 1 }
          $version = $match.Groups[1].Value
          $tag = '${{ github.ref_name }}'
          if ($tag -ne "v$version") { Write-Host "tag $tag does not match version $version"; exit 1 }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding ascii
          $preview = if ($version.Contains('-')) { 'true' } else { 'false' }
          "preview=$preview" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding ascii

      - name: Run all gates and make the release files
        shell: powershell
        run: .\tools\check.ps1

      # The Store package (FR-134) is not a release file: it is submitted to the Microsoft
      # Store, which signs it. It is kept with this run, built by the same gates.
      - name: Keep the Store package
        if: steps.version.outputs.preview == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: BetterVolume-${{ steps.version.outputs.version }}-store
          path: target/package/BetterVolume-${{ steps.version.outputs.version }}.msix
          if-no-files-found: error

      - name: Create the draft release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $files = @(
            "target\package\BetterVolume-$version-setup.exe",
            "target\package\BetterVolume-$version-portable.exe"
          )
          foreach ($file in $files) { if (-not (Test-Path $file)) { Write-Host "missing $file"; exit 1 } }
          $options = @('--draft', '--verify-tag', '--generate-notes', '--title', "BetterVolume $version")
          if ('${{ steps.version.outputs.preview }}' -eq 'true') { $options += '--prerelease' }
          gh release create '${{ github.ref_name }}' @files @options
          if ($LASTEXITCODE -ne 0) { exit 1 }
