# Why the package declares the restricted capability runFullTrust (Partner Center asks
# for it in the submission's "Submission options"; its box takes 500 characters).
run_full_trust = """
BetterVolume is a classic Win32 desktop app packaged for the Store. Full trust lets it show its icon in the notification area, read and change audio devices and volumes through Windows Core Audio, start with Windows via the package's startup task and, only if the user enables it, hide the taskbar's volume icon by loading a helper of the package into Explorer. It sends no user data; its only network use is an optional MQTT link to the user's own Home Assistant.
"""

# Notes for certification (Partner Center, "Submission options").
certification_notes = """
No account or sign-in is needed. After the first start, BetterVolume shows a speaker icon in the notification area next to the clock (if Windows puts it behind the ^ arrow, BetterVolume asks Windows to show it on the taskbar). Click it to open the panel: one tile per output device, the volume of each application playing sound, the microphone view. The settings open from the gear button of the panel or from the right-click menu of the icon. The Home Assistant link is optional and off by default; it needs the user's own MQTT server, and everything else works without it. Updates of the Store version come from the Store only.
"""
