# Microsoft Store listing, Chinese (Simplified). See en-US.toml for the limits.

short_description = "一键在扬声器、耳机和电视之间切换声音，并调节每个应用的音量，面板的外观和动画与 Windows 11 一致。轻巧、免费、开源，可选择连接 Home Assistant。"

description = """
Windows 11 本该自带的音量面板。

单击时钟旁边的 BetterVolume 图标，就会打开一个 Windows 11 风格的面板，每个输出设备都有一个大磁贴。只需单击一次，即可将声音切换到扬声器、耳机或电视。在它们下方，可以调节每个正在播放声音的应用的音量、主音量和麦克风。

BetterVolume 的外观和动画与 Windows 11 一致：浅色或深色主题、你的主题色、相同的动画，并且支持键盘和屏幕阅读器。它只需要几 MB 内存，等待时几乎不占用处理器时间。

按你的方式使用：重命名设备，按你喜欢的顺序排列，从 27 个图案中为每个设备选择图标，并隐藏从不使用的设备。选择每个应用在面板中的位置，或将其隐藏。时钟旁边的图标显示音量级别，还可以显示正在播放的设备，采用 Windows 风格或使用你的主题色的彩色风格。在图标上滚动鼠标滚轮可调节音量，单击鼠标中键可静音。BetterVolume 还可以隐藏 Windows 音量图标，只保留一个音量图标。

Home Assistant（可选）：通过 MQTT 将 BetterVolume 连接到你的 Home Assistant 服务器，每台电脑都会作为一个设备出现，带有音频输出、音量、静音、麦克风和媒体按钮，并在两个方向实时更新。你的自动化可以在电视打开时将声音切换到电视，在有人按门铃时降低音量，或在你离开时暂停音乐。卸载 BetterVolume 之前，请在其设置中关闭 Home Assistant 连接：这会将该电脑从 Home Assistant 中移除。

BetterVolume 免费、开源，不会发送任何关于你的信息：它唯一的网络连接是可选的、到你自己的 Home Assistant 服务器的连接。它支持简体中文、英语、法语、德语、西班牙语、意大利语、葡萄牙语（巴西）、荷兰语、波兰语和日语，并跟随 Windows 显示语言。

已经在使用从项目页面下载的 BetterVolume？首次启动时，应用商店版本会沿用你的设置；之后你可以卸载另一个副本。
"""

