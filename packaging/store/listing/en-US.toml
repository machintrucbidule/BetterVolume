short_description = "Switch between your speakers, headset and TV in one click and set the volume of each application, in a panel that looks and moves like Windows 11. Light, free, open source, with an optional Home Assistant link."

description = """
The volume panel Windows 11 should have had.

Click the BetterVolume icon next to the clock: a panel in the Windows 11 style opens, with one large tile per output device. One click switches the sound between your speakers, your headset and your TV. Below them, set the volume of each application playing sound, the master volume and the microphone.

BetterVolume looks and moves like Windows 11: light or dark theme, your accent colour, the same animations, and it works with the keyboard and screen readers. It needs only a few megabytes of memory and practically no processor time while it waits.

Make it yours: rename your devices, put them in your order, give each one its icon among 27 drawings, and hide those you never use. Choose the place of each application in the panel, or hide it. The icon next to the clock shows the volume level and, if you like, the device playing now, in the Windows style or in a colourful style in your accent colour. The mouse wheel over it changes the volume, a middle click mutes. BetterVolume can also hide the Windows volume icon, so that only one remains.

Home Assistant (optional): link BetterVolume to your Home Assistant server through MQTT, and each PC appears as a device with its audio output, volume, mute, microphone and media buttons, updated live in both directions. Your automations can switch the sound to the TV when it turns on, lower the volume when someone rings at the door, or pause the music when you leave. Before uninstalling BetterVolume, turn the Home Assistant link off in its settings: this removes the PC from Home Assistant.

BetterVolume is free, open source, and sends nothing about you: its only network connection is the optional link to your own Home Assistant server. It speaks English, French, German, Spanish, Italian, Portuguese (Brazil), Dutch, Polish, Japanese and Simplified Chinese, and follows the Windows display language.

Already using BetterVolume downloaded from its project page? At its first start, the Store version takes over your settings; you can then uninstall the other copy.
"""

