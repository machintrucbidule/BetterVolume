short_description = "スピーカー、ヘッドセット、テレビをワンクリックで切り替え、アプリごとの音量を調整。Windows 11 と同じ見た目と動きのパネルで操作できます。軽量、無料、オープンソースで、Home Assistant との連携にも対応 (オプション)。"

description = """
Windows 11 に最初からあってほしかった音量パネル。

時計の横の BetterVolume アイコンをクリックすると、Windows 11 スタイルのパネルが開き、出力デバイスごとに大きなタイルが表示されます。ワンクリックで、スピーカー、ヘッドセット、テレビの間で音声を切り替えられます。その下では、音声を再生中の各アプリの音量、全体の音量、マイクを調整できます。

BetterVolume は Windows 11 と同じ見た目と動きです。ライト テーマとダーク テーマ、アクセント カラー、同じアニメーションに対応し、キーボードやスクリーン リーダーでも操作できます。必要なメモリはわずか数メガバイトで、待機中はほとんど CPU を使いません。

自分好みに: デバイスの名前を変更し、好きな順番に並べ、27 種類の絵柄からアイコンを選び、使わないデバイスは非表示にできます。パネル内の各アプリの位置を選んだり、アプリを非表示にしたりすることもできます。時計の横のアイコンは音量レベルと、必要に応じて再生中のデバイスを、Windows スタイルまたはアクセント カラーのカラフル スタイルで表示します。アイコンの上でマウス ホイールを回すと音量が変わり、中クリックでミュートできます。BetterVolume は Windows の音量アイコンを非表示にして、アイコンを 1 つにまとめることもできます。

Home Assistant (オプション): MQTT で BetterVolume を Home Assistant サーバーに接続すると、各 PC がオーディオ出力、音量、ミュート、マイク、メディア ボタンを持つデバイスとして表示され、双方向にリアルタイムで更新されます。オートメーションで、テレビの電源が入ったら音声をテレビに切り替えたり、玄関のチャイムが鳴ったら音量を下げたり、外出時に音楽を一時停止したりできます。BetterVolume をアンインストールする前に、設定で Home Assistant との連携をオフにしてください。これで PC が Home Assistant から削除されます。

BetterVolume は無料のオープンソース ソフトウェアで、あなたに関する情報は一切送信しません。ネットワーク接続は、オプションのご自身の Home Assistant サーバーとの連携だけです。日本語、英語、フランス語、ドイツ語、スペイン語、イタリア語、ポルトガル語 (ブラジル)、オランダ語、ポーランド語、簡体字中国語に対応し、Windows の表示言語に従います。

プロジェクト ページからダウンロードした BetterVolume をすでにお使いですか? Store 版は初回起動時にその設定を引き継ぎます。その後、もう一方のコピーはアンインストールしてかまいません。
"""

