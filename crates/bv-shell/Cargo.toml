[package]
name = "bv-shell"
description = "BetterVolume Windows plumbing: tray icon, popups, single instance, OS preferences"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
bv-core.workspace = true
bv-ui-kit.workspace = true
# The COM `implement` macro (UI Automation providers) names this crate.
windows-core.workspace = true

[dependencies.windows]
workspace = true
features = [
    "ApplicationModel",
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Networking_WinHttp",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_Storage_Packaging_Appx",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Environment",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Time",
    "Win32_System_Variant",
    "Win32_UI_Accessibility",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

# Tests compare and print UI Automation property values (VARIANT equality and display).
[dev-dependencies.windows]
workspace = true
features = ["Win32_System_Com_StructuredStorage"]
