[package]
name = "bv-mqtt"
description = "BetterVolume Home Assistant link: MQTT connection, discovery, state and command topics"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# The small broker used by tests and by the footprint measurement (never shipped).
test-broker = ["dep:schannel"]

[dependencies]
bv-core.workspace = true
# Encryption through the Windows TLS implementation (Schannel): no TLS code of our own,
# the Windows certificate store decides what is trusted.
native-tls = "0.2"
# Test broker only: server-side TLS with a key kept in memory.
schannel = { version = "0.1", optional = true }

[dev-dependencies]
schannel = "0.1"

[[example]]
name = "test-broker"
required-features = ["test-broker"]
